<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · {{ brand_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <div class="mark">
      <span class="rail-mark"><i></i></span>
      <span class="rail-name">{{ brand_name }}<span>visibility console</span></span>
    </div>
    <h1>Sign in</h1>
    <p>Enter the access key for this panel.</p>
    {% if error %}<div class="err">That key is not correct. Try again.</div>{% endif %}
    <div class="field">
      <label for="key">Access key</label>
      <input class="input" id="key" name="key" type="password" autocomplete="current-password" autofocus>
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Open console</button>
  </form>
</div>
</body>
</html>
