<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SEO Visibility{% endblock %} · {{ brand_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="rail-brand" href="/ai-visibility">
      <span class="rail-mark"><i></i></span>
      <span class="rail-name">{{ brand_name }}<span>visibility console</span></span>
    </a>

    <div class="nav-label">Reports</div>
    <nav class="nav">
      <a class="nav-item {{ 'active' if active == 'ai-visibility' }}" href="/ai-visibility">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.9 2.4L22 18.3l-2.1.9L19 21.6l-.9-2.4-2.1-.9 2.1-.9z"/></svg>
        <span class="t">AI Visibility</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'map-grid' }}" href="/map-grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <span class="t">Map Grid</span>
      </a>
    </nav>

    <div class="nav-label">Configure</div>
    <nav class="nav">
      <a class="nav-item {{ 'active' if active == 'brands' }}" href="/brands">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span class="t">Brands &amp; keywords</span>
      </a>
      <a class="nav-item {{ 'active' if active == 'settings' }}" href="/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5 11.9a7 7 0 0 0 0 2.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h5l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></svg>
        <span class="t">Settings</span>
      </a>
    </nav>

    <div class="rail-foot">
      DataForSEO pay-as-you-go<br>
      AI Overviews + Google Maps<br><br>
      <a href="/logout">Sign out</a>
    </div>
  </aside>

  <div class="main">
    {% block topbar %}{% endblock %}
    <div class="graticule"></div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
